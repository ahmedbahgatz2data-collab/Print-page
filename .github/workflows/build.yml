name: Build exe and release

# Manual build: Actions tab -> Run workflow.
# Release (users get the update automatically): push a tag such as v1.1.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install selenium pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --clean --collect-all selenium --name WebToPDF web_to_pdf_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: WebToPDF
          path: dist/WebToPDF.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WebToPDF.exe
          generate_release_notes: true
